[project]
name = "lox-space"
description = "An astrodynamics library for orbital mechanics, mission analysis, and telecommunications"
authors = [{name = "Helge Eichhorn", email = "git@helgeeichhorn.de"}]
license = {text = "MPL-2.0"}
readme = "crates/lox-space/README.md"
requires-python = ">=3.11"
keywords = ["astrodynamics", "orbital-mechanics", "mission-analysis", "space"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy >= 1.16.0"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/lox-space/lox"
Documentation = "https://python.lox.rs"
Repository = "https://github.com/lox-space/lox"

[dependency-groups]
dev = [
  {include-group = "lint"},
  "astropy>=6.0",
  "ipython",
  "maturin",
  "mypy>=2.4.0",
  "pytest",
  "pytest-codspeed",
  "pytest-cov>=6.0.0",
  "skyfield>=1.45",
  "spacelink",
  "spiceypy>=6.0.0",
]
lint = ["ruff==0.17.3"]
docs = ["zensical", "mkdocstrings[python]>=0.18"]

[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/lox-space/Cargo.toml"
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["crates/lox-space/tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "benchmark: marks tests as benchmark tests",
]

[tool.ruff]
# The stub uses `type` aliases, which only need to parse for type checkers.
per-file-target-version = { "*.pyi" = "py312" }

[tool.ruff.lint.per-file-ignores]
# Stub bodies are a docstring followed by `...`.
"*.pyi" = ["PIE790", "PYI048"]
# The comparison tests call `__eq__` directly, including on the same object.
"crates/lox-space/tests/*" = ["PLR0124", "SIM201"]

[tool.uv]
# Rebuild package when any rust files change
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "crates/**/*.pyi" },
  { file = "crates/**/*.rs" },
]
