#
# NOTE: Path filters, the concurrency group, the `pyodide` job, the pinned
# Python version, the release-only targets and the single-interpreter PR builds
# were added manually. Re-running `maturin generate-ci` will overwrite these
# changes.
name: Python

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'lox-space-*'
  pull_request:
    paths:
      - 'crates/lox-space/**'
      - 'crates/lox-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The interpreter used for the test venv and, on pull requests, the only one
  # wheels are built for. Pinned because `3.x` resolves to releases that dev
  # dependencies have no wheels for yet, which makes uv build them from source.
  PYTHON_VERSION: "3.14"
  UV_PYTHON: "3.14"
  # Pull requests build a wheel for one interpreter only; main and tags build
  # every interpreter that gets released.
  INTERPRETER_ARGS: ${{ github.event_name == 'pull_request' && '--interpreter python3.14' || '--find-interpreter' }}

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
        # Release-only targets, skipped on pull requests
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":{"runner":"ubuntu-22.04","target":"x86"}},{"platform":{"runner":"ubuntu-latest","target":"aarch64"}}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }}
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          # maturin-action exports RUSTC_WRAPPER=sccache and installs sccache
          # inside the manylinux build container; this step runs on the host,
          # where sccache is absent, so unset the wrapper for the bundle build.
          unset RUSTC_WRAPPER
          python -m pip download --no-deps itur==0.4.0 -d itur-wheel
          cargo run -p lox-itur --bin pack -- itur-wheel/itur-0.4.0*.whl target/lox-itur-data.npz
          uv sync --locked --no-install-project
          uv pip install lox-space --offline --find-links dist --force-reinstall
          source .venv/bin/activate
          pytest

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
        # Release-only targets, skipped on pull requests
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":{"runner":"windows-latest","target":"x86"}}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x64') }}
        shell: bash
        run: |
          set -e
          # maturin-action exports RUSTC_WRAPPER=sccache and installs sccache
          # inside the manylinux build container; this step runs on the host,
          # where sccache is absent, so unset the wrapper for the bundle build.
          unset RUSTC_WRAPPER
          python -m pip download --no-deps itur==0.4.0 -d itur-wheel
          cargo run -p lox-itur --bin pack -- itur-wheel/itur-0.4.0*.whl target/lox-itur-data.npz
          uv sync --locked --no-install-project
          uv pip install lox-space --offline --find-links dist --force-reinstall
          source .venv/Scripts/activate
          pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
        # Release-only targets, skipped on pull requests
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":{"runner":"macos-15-intel","target":"x86_64"}}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        run: |
          set -e
          # maturin-action exports RUSTC_WRAPPER=sccache and installs sccache
          # inside the manylinux build container; this step runs on the host,
          # where sccache is absent, so unset the wrapper for the bundle build.
          unset RUSTC_WRAPPER
          python -m pip download --no-deps itur==0.4.0 -d itur-wheel
          cargo run -p lox-itur --bin pack -- itur-wheel/itur-0.4.0*.whl target/lox-itur-data.npz
          uv sync --locked --no-install-project
          uv pip install lox-space --offline --find-links dist --force-reinstall
          source .venv/bin/activate
          pytest

  pyodide:
    name: pyodide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Resolve the pinned Pyodide version
        id: pyodide
        run: echo "version=$(just --evaluate pyodide_version)" >> "$GITHUB_OUTPUT"
      - name: Cache the Pyodide cross-build environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyodide-build
          key: pyodide-xbuildenv-${{ steps.pyodide.outputs.version }}
      - name: Install the cross-build environment
        run: just pyodide-setup
      - name: Build wheel
        run: just build-pyodide
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: dist-pyodide
      - name: pytest
        run: |
          set -e
          python -m pip download --no-deps itur==0.4.0 -d itur-wheel
          cargo run -p lox-itur --bin pack -- itur-wheel/itur-0.4.0*.whl target/lox-itur-data.npz
          just pytest-pyodide

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    environment: release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [ linux, windows, macos, pyodide, sdist ]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
