[workspace]
members = ["crates/*"]
exclude = ["tools/lox-gen", "crates/lox-odm/fuzz"]
resolver = "3"

[workspace.package]
rust-version = "1.90"
edition = "2024"
license = "MPL-2.0"
authors = ["Helge Eichhorn and the lox-space contributors"]
repository = "https://github.com/lox-space/lox"
keywords = ["lox", "astrodynamics", "orbital-dynamics", "mission-analysis"]
homepage = "https://github.com/lox-space/lox"
categories = ["aerospace", "science"]

[workspace.dependencies]
lox-analysis = { path = "crates/lox-analysis", version = "0.1.0-alpha.16" }
lox-approx = { path = "crates/lox-approx", version = "0.1.2", default-features = false }
lox-bodies = { path = "crates/lox-bodies", version = "0.1.0-alpha.28" }
lox-comms = { path = "crates/lox-comms", version = "0.1.0-alpha.17" }
lox-core = { path = "crates/lox-core", version = "0.1.0-alpha.16", default-features = false }
lox-derive = { path = "crates/lox-derive", version = "0.1.0" }
lox-earth = { path = "crates/lox-earth", version = "0.1.0-alpha.31" }
lox-ephem = { path = "crates/lox-ephem", version = "0.1.0-alpha.26" }
lox-frames = { path = "crates/lox-frames", version = "0.1.0-alpha.22" }
lox-io = { path = "crates/lox-io", version = "0.1.0-alpha.26" }
lox-itur = { path = "crates/lox-itur", version = "0.1.0-alpha.7" }
lox-odm = { path = "crates/lox-odm", version = "0.1.0-alpha.5" }
lox-orbits = { path = "crates/lox-orbits", version = "0.1.0-alpha.41" }
lox-test-utils = { path = "crates/lox-test-utils" }
lox-time = { path = "crates/lox-time", version = "0.1.0-alpha.28" }

arrayvec = "0.7.8"
chrono = "0.4.45"
csv = "1.4.0"
differential-equations = "0.7.0"
divan = { package = "codspeed-divan-compat", version = "4.3.0" }
geo = "0.33"
geojson = "1.0"
glam = { version = "0.34.1", default-features = false, features = ["f64"] }
itertools = "0.15.0"
libm = "0.2.16"
nalgebra = "0.35.0"
nom = { version = "8.0.0", default-features = false }
numpy = "0.29.0"
proptest = "1.12.0"
pyo3 = "0.29.3"
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
rayon = "1.12.0"
rstest = "0.27.0"
# no_std crates (lox-core, lox-time, …) forward `serde?/std` from their own `std` feature.
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive", "rc"] }
serde_json = "1.0.154"
sgp4 = "2.4.0"
sha2 = "0.11"
tempfile = "3"
thiserror = { version = "2", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
