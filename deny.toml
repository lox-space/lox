[advisories]
unmaintained = "workspace"

# Only licenses that can be combined with MPL-2.0 without imposing additional
# obligations on the larger work: permissive licenses and MPL-2.0 itself.
# Strong copyleft (GPL, AGPL, LGPL) is excluded on purpose.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
