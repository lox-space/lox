[package]
name = "lox-core"
description = "Common data types and utilities for the Lox ecosystem"
version = "0.1.0-alpha.17"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
lox-approx = { workspace = true, default-features = false, features = ["derive", "glam"] }

glam.workspace = true
hifitime = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
libm = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "glam/std",
    "lox-approx/std",
    "hifitime?/std",
    "jiff?/std",
    "serde?/std",
    "time?/std",
]
libm = [
    "dep:libm",
    "glam/libm",
]
hifitime = ["dep:hifitime"]
jiff = ["dep:jiff"]
serde = ["dep:serde", "glam/serde"]
time-rs = ["dep:time"]

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true
serde_json.workspace = true
