[package]
name = "lox-time"
description = "Time modelling tools for the Lox ecosystem"
version = "0.1.0-alpha.29"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
lox-approx = { workspace = true, default-features = false }
lox-core = { workspace = true, default-features = false }

jiff = { workspace = true, optional = true }
nom = { workspace = true, features = ["alloc"] }
serde = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

[features]
default = ["std"]
std = [
    "lox-core/std",
    "lox-approx/std",
    "nom/std",
    "jiff?/std",
    "serde?/std",
    "time?/std",
]
libm = ["lox-core/libm"]
jiff = ["dep:jiff", "lox-core/jiff"]
serde = ["dep:serde", "lox-core/serde"]
time-rs = ["dep:time", "lox-core/time-rs"]
